name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Validate game metadata and cover assets
        run: python scripts/enrich_games.py

      - name: Build site
        env:
          HUGO_BASE_URL: ${{ vars.HUGO_BASE_URL }}
        run: |
          if [[ -n "$HUGO_BASE_URL" ]]; then
            base_url="$HUGO_BASE_URL"
          else
            repository="${GITHUB_REPOSITORY#*/}"
            if [[ "$repository" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
            else
              base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository}/"
            fi
          fi
          hugo --minify --baseURL "$base_url"

      - name: Push site to gh-pages
        run: python scripts/deploy.py
